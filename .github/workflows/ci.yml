name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  weryfikacja:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Aplikacja szuka plików ripgrepem; na czystym runnerze nie ma ani `rg`,
      # ani Claude Code (z którego binarki korzystamy jako zapasu lokalnie).
      # Bez tego m7-git-search i m37-cmdp padają na samym środowisku.
      - run: brew install ripgrep
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # Testy Playwright uruchamiają okna Electrona — potrzebny wirtualny ekran.
      - run: npm run e2e
        env:
          # Bundlowanie Monaco przekracza domyślny limit sterty Node na runnerze
          # (build w `npm run e2e` padał z „heap out of memory", exit 134).
          # Ten sam zapas co w workflow wydania.
          NODE_OPTIONS: --max-old-space-size=6144
