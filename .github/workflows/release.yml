name: Wydanie

# Paczki powstają na maszynach docelowych: macOS buduje .dmg, Windows .exe.
# Uruchamiane tagiem (np. v0.1.0) albo ręcznie z zakładki Actions.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  paczka:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            komenda: npm run dist:mac
            artefakty: dist/*.dmg
          - os: windows-latest
            komenda: npm run dist:win
            artefakty: |
              dist/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: ${{ matrix.komenda }}
      - uses: actions/upload-artifact@v4
        with:
          name: sufler-${{ matrix.os }}
          path: ${{ matrix.artefakty }}
